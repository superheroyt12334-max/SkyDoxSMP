
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Minecraft Website</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #071b3a, #0879c9);
      color: white;
      text-align: center;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .card {
      padding: 40px;
      margin: 20px;
      border: 1px solid #45baff;
      border-radius: 20px;
      background: #071b3acc;
      box-shadow: 0 0 30px #159cff55;
    }
    h1 { font-size: 42px; color: #55c5ff; }
    a {
      display: inline-block;
      padding: 12px 22px;
      background: #168fe5;
      color: white;
      text-decoration: none;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>My Website</h1>
    <p>Welcome to my Minecraft world!</p>
    <a href="https://discord.com/" target="_blank">
      Join Discord
    </a>
  </div>
</body>
</html>
